[project]
name = "kitchen-agent"
version = "0.1.0"
description = "Autonomous kitchen inventory and meal planning assistant powered by Discord, Gemini, and Grocy MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grocy-mcp>=0.2.0",
    "mcp>=2.3.0",
    "discord.py>=2.7.1",
    "google-genai>=2.29.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "apscheduler>=3.11.0",
    "httpx>=0.28.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "tests*", "scripts*"]

[tool.setuptools]
py-modules = ["config", "main"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"app/llm/prompts.py" = ["E501"]



